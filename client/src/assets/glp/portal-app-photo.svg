<svg xmlns="http://www.w3.org/2000/svg" width="300" height="300" viewBox="0 0 300 300">
  <defs>
    <linearGradient id="portal-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2b4864" />
      <stop offset="100%" stop-color="#1c3348" />
    </linearGradient>
  </defs>
  <rect width="300" height="300" rx="20" fill="url(#portal-bg)" />

  <!-- infinity mark -->
  <g transform="translate(110 34)">
    <circle cx="14" cy="14" r="11" stroke="#c9a575" stroke-width="3.2" fill="none" />
    <circle cx="34" cy="14" r="11" stroke="#c9a575" stroke-width="3.2" fill="none" />
    <circle cx="24" cy="14" r="3" fill="#fff6e6" />
  </g>
  <text x="50%" y="76" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="15" font-weight="700" fill="#ffffff">AUM health</text>
  <text x="50%" y="94" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="9" letter-spacing="1" fill="#c4d3e6">PATIENT PORTAL</text>

  <!-- phone/app card -->
  <rect x="46" y="116" width="208" height="150" rx="16" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.25" />

  <!-- checklist rows -->
  <g font-family="Segoe UI, sans-serif" font-size="12" fill="#ffffff">
    <circle cx="68" cy="140" r="8" fill="#4a9d6f" />
    <text x="68" y="144" text-anchor="middle" font-size="10" fill="#fff">✓</text>
    <rect x="86" y="135" width="140" height="10" rx="5" fill="#ffffff" fill-opacity="0.35" />

    <circle cx="68" cy="170" r="8" fill="#4a9d6f" />
    <text x="68" y="174" text-anchor="middle" font-size="10" fill="#fff">✓</text>
    <rect x="86" y="165" width="110" height="10" rx="5" fill="#ffffff" fill-opacity="0.35" />

    <circle cx="68" cy="200" r="8" fill="none" stroke="#c9a575" stroke-width="2" />
    <rect x="86" y="195" width="125" height="10" rx="5" fill="#ffffff" fill-opacity="0.2" />
  </g>

  <!-- message chip -->
  <rect x="68" y="224" width="164" height="26" rx="13" fill="#c9a575" fill-opacity="0.9" />
  <text x="150" y="241" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" font-weight="700" fill="#1c3348">Message your provider</text>
</svg>
