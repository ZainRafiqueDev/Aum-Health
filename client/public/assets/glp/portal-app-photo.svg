<svg xmlns="http://www.w3.org/2000/svg" width="300" height="300" viewBox="0 0 300 300">
  <defs>
    <linearGradient id="portal-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2b4864" />
      <stop offset="100%" stop-color="#1c3348" />
    </linearGradient>
  </defs>
  <rect width="300" height="300" rx="20" fill="url(#portal-bg)" />

  <!-- brand logo: crop tightly to just the mark (source PNG has a lot of
       transparent padding + a too-thin-to-read baked-in wordmark), then pair
       it with our own crisp, sized-up "AUM health" text -->
  <clipPath id="portal-logo-clip">
    <rect x="85" y="16" width="130" height="46" />
  </clipPath>
  <image
    href="/assets/logo/logo1.png"
    x="-30.16"
    y="-123.89"
    width="361"
    height="345.6"
    clip-path="url(#portal-logo-clip)"
  />
  <text x="50%" y="86" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="20" font-weight="800" letter-spacing="0.5">
    <tspan fill="#ffffff">AUM</tspan>
    <tspan fill="#c9a575" dx="4" font-weight="400">health</tspan>
  </text>
  <text x="50%" y="104" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="9" letter-spacing="1" fill="#c4d3e6">PATIENT PORTAL</text>

  <!-- phone/app card -->
  <rect x="46" y="118" width="208" height="168" rx="16" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.25" />

  <!-- checklist rows -->
  <g font-family="Segoe UI, sans-serif" font-size="12" fill="#ffffff">
    <circle cx="68" cy="148" r="8" fill="#4a9d6f" />
    <text x="68" y="152" text-anchor="middle" font-size="10" fill="#fff">✓</text>
    <rect x="86" y="143" width="140" height="10" rx="5" fill="#ffffff" fill-opacity="0.35" />

    <circle cx="68" cy="182" r="8" fill="#4a9d6f" />
    <text x="68" y="186" text-anchor="middle" font-size="10" fill="#fff">✓</text>
    <rect x="86" y="177" width="110" height="10" rx="5" fill="#ffffff" fill-opacity="0.35" />

    <circle cx="68" cy="216" r="8" fill="none" stroke="#c9a575" stroke-width="2" />
    <rect x="86" y="211" width="125" height="10" rx="5" fill="#ffffff" fill-opacity="0.2" />
  </g>

  <!-- message chip -->
  <rect x="68" y="246" width="164" height="26" rx="13" fill="#c9a575" fill-opacity="0.9" />
  <text x="150" y="263" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" font-weight="700" fill="#1c3348">Message your provider</text>
</svg>
